version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -f .env.production
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "DIRECT_DATABASE_URL=$DIRECT_DATABASE_URL" >> .env.production
        - echo "PLATFORM_ADMIN_EMAILS=$PLATFORM_ADMIN_EMAILS" >> .env.production
        - echo "AUTH_SECRET=$AUTH_SECRET" >> .env.production
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.production
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production
        - echo "PLATFORM_ADMIN_ACCESS_CODE=$PLATFORM_ADMIN_ACCESS_CODE" >> .env.production
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "EMAIL_FROM=$EMAIL_FROM" >> .env.production
        - echo "PLATFORM_NOTIFICATION_EMAIL=$PLATFORM_NOTIFICATION_EMAIL" >> .env.production
        - echo "RESEND_WEBHOOK_SECRET=$RESEND_WEBHOOK_SECRET" >> .env.production
        - echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" >> .env.production
        - echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET" >> .env.production
        - echo "STRIPE_TENANT_WEBHOOK_SECRET=$STRIPE_TENANT_WEBHOOK_SECRET" >> .env.production
        - echo "STRIPE_PRICE_MONTHLY_SUBSCRIPTION=$STRIPE_PRICE_MONTHLY_SUBSCRIPTION" >> .env.production
        - echo "STRIPE_PRICE_SETUP_FEE=$STRIPE_PRICE_SETUP_FEE" >> .env.production
        - echo "STRIPE_PRICE_DOMAIN_SERVICE=$STRIPE_PRICE_DOMAIN_SERVICE" >> .env.production
        - echo "STRIPE_PLATFORM_TEST_PRICE_ID=$STRIPE_PLATFORM_TEST_PRICE_ID" >> .env.production
        - echo "STRIPE_PLATFORM_TEST_PRODUCT_ID=$STRIPE_PLATFORM_TEST_PRODUCT_ID" >> .env.production
        - echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> .env.production
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
