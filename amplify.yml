version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -f .env.production
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "DIRECT_DATABASE_URL=$DIRECT_DATABASE_URL" >> .env.production
        - echo "PLATFORM_ADMIN_EMAILS=$PLATFORM_ADMIN_EMAILS" >> .env.production
        - echo "AUTH_SECRET=$AUTH_SECRET" >> .env.production
        - echo "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" >> .env.production
        - echo "NEXTAUTH_URL=$NEXTAUTH_URL" >> .env.production
        - echo "PLATFORM_ADMIN_ACCESS_CODE=$PLATFORM_ADMIN_ACCESS_CODE" >> .env.production
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
